name: QEMU Zorin Live

on:
  workflow_dispatch: {}

run-name: QEMU Zorin OS (BOOT=zorin) + Quick Tunnel :8006

concurrency:
  group: qemu-zorin-live
  cancel-in-progress: false

jobs:
  qemu:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      BOOT: zorin
      CPU_CORES: "4"
      RAM_SIZE: "11G"
      DISK_SIZE: "40G"
      KVM: "Y"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 🎨 Init UI helper + timer
        run: |
          # Helper tampilan log (warna, banner, progress bar). Disimpan di RUNNER_TEMP
          # supaya tidak ikut terhapus oleh step cleanup disk.
          cat > "$RUNNER_TEMP/ui.sh" <<'EOF'
          # shellcheck shell=bash
          C_RESET=$'\033[0m'; C_BOLD=$'\033[1m'; C_DIM=$'\033[2m'
          C_RED=$'\033[1;31m'; C_GREEN=$'\033[1;32m'; C_YELLOW=$'\033[1;33m'
          C_BLUE=$'\033[1;34m'; C_MAGENTA=$'\033[1;35m'; C_CYAN=$'\033[1;36m'; C_WHITE=$'\033[1;37m'

          ui_rep() { local i; for ((i=0; i<$2; i++)); do printf '%s' "$1"; done; }
          ui_hr() { printf '%s' "$C_DIM"; ui_rep '─' 64; printf '%s\n' "$C_RESET"; }
          ui_banner() {
            local title="$1" sub="${2:-}"
            printf '%s╔' "$C_CYAN"; ui_rep '═' 62; printf '╗%s\n' "$C_RESET"
            printf '%s║%s %s%-60s%s %s║%s\n' "$C_CYAN" "$C_RESET" "$C_BOLD" "$title" "$C_RESET" "$C_CYAN" "$C_RESET"
            if [ -n "$sub" ]; then
              printf '%s║%s %s%-60s%s %s║%s\n' "$C_CYAN" "$C_RESET" "$C_DIM" "$sub" "$C_RESET" "$C_CYAN" "$C_RESET"
            fi
            printf '%s╚' "$C_CYAN"; ui_rep '═' 62; printf '╝%s\n' "$C_RESET"
          }
          ui_section() { echo ""; echo "${C_WHITE}$*${C_RESET}"; ui_hr; }
          ui_step()  { echo "${C_MAGENTA}▶ $*${C_RESET}"; }
          ui_ok()    { echo "${C_GREEN}✔ $*${C_RESET}"; }
          ui_info()  { echo "${C_BLUE}ℹ $*${C_RESET}"; }
          ui_warn()  { echo "${C_YELLOW}⚠ $*${C_RESET}"; echo "::warning::$*"; }
          ui_err()   { echo "${C_RED}✖ $*${C_RESET}"; echo "::error::$*"; }
          ui_kv()    { printf '  %s%-22s%s %s\n' "$C_DIM" "$1" "$C_RESET" "$2"; }
          ui_group() { echo "::group::$*"; }
          ui_endgroup() { echo "::endgroup::"; }

          # ui_bar <persen> [lebar]  -> bar berwarna (hijau <70, kuning <90, merah >=90)
          ui_bar() {
            local p="${1:-0}" w="${2:-30}" f col
            if [ "$p" -lt 0 ]; then p=0; fi
            if [ "$p" -gt 100 ]; then p=100; fi
            f=$(( p * w / 100 ))
            if [ "$p" -ge 90 ]; then col="$C_RED"; elif [ "$p" -ge 70 ]; then col="$C_YELLOW"; else col="$C_GREEN"; fi
            printf '%s' "$col"; ui_rep '█' "$f"
            printf '%s' "$C_DIM"; ui_rep '░' $(( w - f ))
            printf '%s %3d%%\n' "$C_RESET" "$p"
          }
          ui_bar_line() { printf '  %-10s ' "$1"; ui_bar "$2" 30; }

          ui_fmt()     { printf '%02d:%02d:%02d' $(( $1 / 3600 )) $(( $1 % 3600 / 60 )) $(( $1 % 60 )); }
          ui_elapsed() { echo $(( $(date +%s) - ${JOB_START_TS:-$(date +%s)} )); }
          ui_pct()     { df -P "$1" 2>/dev/null | awk 'NR==2 {gsub("%","",$5); print $5}'; }
          ui_gb()      { awk -v m="$1" 'BEGIN { printf "%.1f", m/1024 }'; }
          lscpu_field() { LC_ALL=C lscpu 2>/dev/null | awk -F: -v k="$1" '$1==k {sub(/^[ \t]+/,"",$2); print $2; exit}'; }
          ui_flag() {
            if grep -qwi -- "$1" <<<"${FLAGS_LINE:-}"; then
              printf '%s✔%s %s   ' "$C_GREEN" "$C_RESET" "$1"
            else
              printf '%s✖%s %s   ' "$C_RED" "$C_RESET" "$1"
            fi
          }
          EOF
          source "$RUNNER_TEMP/ui.sh"
          echo "JOB_START_TS=$(date +%s)" >> "$GITHUB_ENV"
          ui_banner "QEMU ZORIN OS LIVE" "GitHub Actions + qemux/qemu + Cloudflare Quick Tunnel"
          ui_kv "Mulai (UTC)" "$(date -u '+%Y-%m-%d %H:%M:%S')"
          ui_kv "Runner" "${RUNNER_OS:-?} / ${RUNNER_ARCH:-?}"
          ui_kv "Guest OS" "BOOT=$BOOT"
          ui_ok "UI helper siap"

      - name: 🖥️ Host spec check + approval window (30s)
        run: |
          source "$RUNNER_TEMP/ui.sh"
          ui_banner "HOST SPEC CHECK" "Spesifikasi runner sebelum VM dijalankan"

          # ---------- kumpulkan data ----------
          CPU_MODEL=$(lscpu_field "Model name")
          if [ -z "$CPU_MODEL" ]; then
            CPU_MODEL=$(awk -F: '/model name/ {sub(/^[ \t]+/,"",$2); print $2; exit}' /proc/cpuinfo)
          fi
          [ -n "$CPU_MODEL" ] || CPU_MODEL="(tidak terdeteksi)"
          CPU_VENDOR=$(lscpu_field "Vendor ID");        [ -n "$CPU_VENDOR" ] || CPU_VENDOR="-"
          CPU_ARCH=$(lscpu_field "Architecture");       [ -n "$CPU_ARCH" ] || CPU_ARCH=$(uname -m)
          CPU_THREADS=$(nproc)
          CPU_SOCKETS=$(lscpu_field "Socket(s)");       [ -n "$CPU_SOCKETS" ] || CPU_SOCKETS="-"
          CPU_CORES_PS=$(lscpu_field "Core(s) per socket"); [ -n "$CPU_CORES_PS" ] || CPU_CORES_PS="-"
          CPU_TPC=$(lscpu_field "Thread(s) per core");  [ -n "$CPU_TPC" ] || CPU_TPC="-"
          CPU_MHZ=$(lscpu_field "CPU max MHz")
          [ -n "$CPU_MHZ" ] || CPU_MHZ=$(lscpu_field "CPU MHz")
          [ -n "$CPU_MHZ" ] || CPU_MHZ=$(awk -F: '/cpu MHz/ {sub(/^[ \t]+/,"",$2); print $2; exit}' /proc/cpuinfo)
          if [ -n "$CPU_MHZ" ]; then CPU_MHZ=$(awk -v m="$CPU_MHZ" 'BEGIN { printf "%.0f MHz", m }'); else CPU_MHZ="-"; fi
          CPU_L2=$(lscpu_field "L2 cache");             [ -n "$CPU_L2" ] || CPU_L2="-"
          CPU_L3=$(lscpu_field "L3 cache");             [ -n "$CPU_L3" ] || CPU_L3="-"
          HYP_VENDOR=$(lscpu_field "Hypervisor vendor"); [ -n "$HYP_VENDOR" ] || HYP_VENDOR="-"
          VIRT_TYPE=$(lscpu_field "Virtualization type"); [ -n "$VIRT_TYPE" ] || VIRT_TYPE="-"
          VMX_COUNT=$(grep -Ec '(vmx|svm)' /proc/cpuinfo || true)
          FLAGS_LINE=$(grep -m1 '^flags' /proc/cpuinfo || true)
          KERNEL=$(uname -r)
          OS_NAME=$(. /etc/os-release 2>/dev/null && echo "$PRETTY_NAME")

          read -r MEM_TOTAL_MB MEM_USED_MB MEM_AVAIL_MB < <(free -m | awk '/^Mem:/ {print $2,$3,$7}')
          read -r SWAP_TOTAL_MB SWAP_USED_MB < <(free -m | awk '/^Swap:/ {print $2,$3}')
          MEM_PCT=$(( MEM_USED_MB * 100 / MEM_TOTAL_MB ))
          ROOT_PCT=$(ui_pct /)
          ROOT_AVAIL=$(df -h --output=avail / | tail -n 1 | tr -d ' ')
          ROOT_SIZE=$(df -h --output=size / | tail -n 1 | tr -d ' ')

          # simpan untuk step berikutnya
          {
            echo "HOST_CPU_MODEL=$CPU_MODEL"
            echo "HOST_CPU_THREADS=$CPU_THREADS"
            echo "HOST_RAM_MB=$MEM_TOTAL_MB"
          } >> "$GITHUB_ENV"

          # ---------- tampilkan ----------
          ui_section "🧠 PROCESSOR"
          echo "  ${C_BOLD}${C_CYAN}${CPU_MODEL}${C_RESET}"
          ui_kv "Vendor" "$CPU_VENDOR"
          ui_kv "Arsitektur" "$CPU_ARCH"
          ui_kv "Thread (logical)" "$CPU_THREADS"
          ui_kv "Socket x Core x Thread" "${CPU_SOCKETS} x ${CPU_CORES_PS} x ${CPU_TPC}"
          ui_kv "Clock" "$CPU_MHZ"
          ui_kv "Cache L2 / L3" "${CPU_L2} / ${CPU_L3}"
          printf '  %s%-22s%s ' "$C_DIM" "Fitur CPU" "$C_RESET"
          for f in vmx svm aes avx avx2 avx512f sse4_2; do ui_flag "$f"; done
          echo ""

          ui_section "🧮 MEMORY"
          ui_kv "Total" "$(ui_gb "$MEM_TOTAL_MB") GB"
          ui_kv "Dipakai / Tersedia" "$(ui_gb "$MEM_USED_MB") GB / $(ui_gb "$MEM_AVAIL_MB") GB"
          ui_kv "Swap" "$(ui_gb "$SWAP_TOTAL_MB") GB (terpakai $(ui_gb "$SWAP_USED_MB") GB)"
          ui_bar_line "RAM" "$MEM_PCT"

          ui_section "💽 DISK"
          ui_kv "Root (/)" "${ROOT_AVAIL} bebas dari ${ROOT_SIZE}"
          ui_bar_line "/" "$ROOT_PCT"

          ui_section "🧬 VIRTUALISASI"
          ui_kv "Hypervisor host" "$HYP_VENDOR"
          ui_kv "Tipe virtualisasi" "$VIRT_TYPE"
          ui_kv "Flag vmx/svm" "$VMX_COUNT"
          ui_kv "Kernel" "$KERNEL"
          ui_kv "OS host" "$OS_NAME"
          if [ -e /dev/kvm ]; then ui_ok "/dev/kvm tersedia: $(ls -l /dev/kvm)"; else ui_warn "NO /dev/kvm (QEMU akan fallback ke TCG/lambat)"; fi
          if [ -e /dev/net/tun ]; then ui_ok "/dev/net/tun tersedia"; else ui_warn "NO /dev/net/tun"; fi
          if command -v docker >/dev/null 2>&1; then ui_ok "$(docker --version)"; else ui_warn "docker belum tersedia"; fi

          ui_section "🎯 ALOKASI GUEST (hardcode, prioritas guest)"
          ui_kv "BOOT" "${BOOT:-zorin}"
          ui_kv "CPU_CORES" "${CPU_CORES:-4}  (host: ${CPU_THREADS} thread)"
          ui_kv "RAM_SIZE" "${RAM_SIZE:-11G}  (host: $(ui_gb "$MEM_TOTAL_MB") GB)"
          ui_kv "DISK_SIZE" "${DISK_SIZE:-40G}  (host bebas: ${ROOT_AVAIL})"
          ui_kv "KVM" "${KVM:-Y}"
          GUEST_RAM_GB="${RAM_SIZE%G}"
          if [ "${CPU_CORES:-4}" -gt "$CPU_THREADS" ]; then
            ui_warn "CPU_CORES guest (${CPU_CORES}) lebih besar dari thread host (${CPU_THREADS})"
          fi
          if [ $(( GUEST_RAM_GB * 1024 )) -gt "$MEM_TOTAL_MB" ]; then
            ui_warn "RAM_SIZE guest (${RAM_SIZE}) lebih besar dari RAM host ($(ui_gb "$MEM_TOTAL_MB") GB)"
          fi

          ui_group "📄 Detail mentah (lscpu, lsblk, df)"
          lscpu || head -n 40 /proc/cpuinfo || true
          echo "--- lsblk ---"; lsblk || true
          echo "--- df ---"; df -h || true
          ui_endgroup

          # ---------- ringkasan di tab Summary ----------
          {
            echo "## 🖥️ Host Spec & Approval"
            echo ""
            echo "| Komponen | Detail |"
            echo "|---|---|"
            echo "| **Processor** | $CPU_MODEL |"
            echo "| Vendor / Arsitektur | $CPU_VENDOR / $CPU_ARCH |"
            echo "| Thread | $CPU_THREADS (${CPU_SOCKETS} socket x ${CPU_CORES_PS} core x ${CPU_TPC} thread) |"
            echo "| Clock | $CPU_MHZ |"
            echo "| Cache L2 / L3 | $CPU_L2 / $CPU_L3 |"
            echo "| RAM host | $(ui_gb "$MEM_TOTAL_MB") GB |"
            echo "| Disk root | ${ROOT_AVAIL} bebas dari ${ROOT_SIZE} |"
            echo "| Hypervisor | $HYP_VENDOR ($VIRT_TYPE) |"
            echo "| Guest | BOOT=${BOOT:-zorin}, ${CPU_CORES:-4} core, ${RAM_SIZE:-11G} RAM, ${DISK_SIZE:-40G} disk |"
            echo ""
            echo "Jika **TIDAK disetujui**, **Cancel workflow sekarang** dari tab Actions."
            echo "Lanjut otomatis dalam **30 detik**."
          } >> "$GITHUB_STEP_SUMMARY"

          # ---------- approval window ----------
          ui_section "⏳ APPROVAL WINDOW"
          echo "::warning::Approval window: cancel workflow dalam 30 detik jika spek host tidak disetujui, workflow lanjut otomatis setelah itu"
          TOTAL=30; STEP=5
          for (( t=0; t<TOTAL; t+=STEP )); do
            printf '  ⏳ %2ds tersisa  ' $(( TOTAL - t )); ui_bar $(( t * 100 / TOTAL )) 24
            sleep "$STEP"
          done
          printf '  ✅ %2ds tersisa  ' 0; ui_bar 100 24
          ui_ok "Approval window selesai, lanjut workflow"

      - name: 🧹 Maximize free space (agresif)
        run: |
          source "$RUNNER_TEMP/ui.sh"
          ui_banner "MAXIMIZE FREE SPACE" "Hapus software bawaan runner yang tidak dipakai"
          BEFORE_KB=$(df --output=avail / | tail -n 1 | tr -d ' ')
          ui_section "💽 Sebelum cleanup"
          ui_bar_line "/" "$(ui_pct /)"
          ui_kv "Bebas" "$(df -h --output=avail / | tail -n 1 | tr -d ' ')"

          ui_group "🗑️ Detail penghapusan (dotnet, android, ghc, codeql, powershell, swift, az)"
          sudo rm -rf /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell \
            /usr/share/swift \
            /opt/az \
            /usr/local/julia* \
            /opt/microsoft/powershell 2>/dev/null || true
          sudo rm -rf /home/runner/.cache/* /home/runner/.npm /home/runner/.cargo 2>/dev/null || true
          docker system prune -af --volumes 2>/dev/null || true
          sudo apt-get clean
          sudo apt-get autoremove -y || true
          sudo rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/* 2>/dev/null || true
          ui_endgroup

          AFTER_KB=$(df --output=avail / | tail -n 1 | tr -d ' ')
          FREED_GB=$(awk -v a="$BEFORE_KB" -v b="$AFTER_KB" 'BEGIN { printf "%.1f", (b-a)/1048576 }')
          ui_section "💽 Sesudah cleanup"
          ui_bar_line "/" "$(ui_pct /)"
          ui_kv "Bebas" "$(df -h --output=avail / | tail -n 1 | tr -d ' ')"
          ui_ok "Ruang yang dibebaskan: ${FREED_GB} GB"
          ui_group "docker system df"
          docker system df || true
          ui_endgroup

      - name: 🗄️ Auto-detect disk terbesar + pindahkan Docker root
        run: |
          source "$RUNNER_TEMP/ui.sh"
          ui_banner "DISK TERBESAR + DOCKER ROOT" "Pilih lokasi storage VM & Docker"

          ui_group "lsblk / df"
          lsblk || true
          df -h --output=target,avail,size,pcent
          ui_endgroup

          # Prioritas: /mnt jika benar-benar mount terpisah & bisa ditulis (sudo), fallback ke GITHUB_WORKSPACE
          BIG_DISK=""
          BEST_AVAIL_KB=0
          # Pastikan /mnt ada dulu (runner baru: /mnt milik root, perlu sudo)
          sudo mkdir -p /mnt 2>/dev/null || true
          ui_section "🔎 Kandidat disk"
          for cand in "$GITHUB_WORKSPACE" "/" "/mnt"; do
            if [ -d "$cand" ]; then
              AVAIL_KB=$(df --output=avail "$cand" | tail -n 1 | tr -d ' ')
              IS_MNT=""
              mountpoint -q "$cand" 2>/dev/null && IS_MNT="(mountpoint)" || IS_MNT="(bukan mount terpisah)"
              ui_kv "$cand" "avail=$(awk -v k="$AVAIL_KB" 'BEGIN { printf "%.1f GB", k/1048576 }') $IS_MNT"
              if [ "$AVAIL_KB" -gt "$BEST_AVAIL_KB" ]; then
                BEST_AVAIL_KB="$AVAIL_KB"
                BIG_DISK="$cand"
              fi
            fi
          done
          # /mnt menang hanya jika dia mountpoint terpisah DAN avail >10GB
          if mountpoint -q /mnt 2>/dev/null; then
            MNT_AVAIL_KB=$(df --output=avail /mnt | tail -n 1 | tr -d ' ')
            if [ "$MNT_AVAIL_KB" -gt 10485760 ]; then
              BIG_DISK="/mnt"
              BEST_AVAIL_KB="$MNT_AVAIL_KB"
            fi
          else
            ui_info "/mnt bukan mount terpisah (image baru hanya punya / 72G), pakai disk terbesar yang terdeteksi"
          fi
          # Fallback mutlak agar tidak kosong
          if [ -z "$BIG_DISK" ]; then
            BIG_DISK="$GITHUB_WORKSPACE"
            BEST_AVAIL_KB=$(df --output=avail "$BIG_DISK" | tail -n 1 | tr -d ' ')
          fi

          ui_ok "BIG_DISK=$BIG_DISK ($(awk -v k="$BEST_AVAIL_KB" 'BEGIN { printf "%.1f GB", k/1048576 }') avail)"
          echo "BIG_DISK=$BIG_DISK" >> "$GITHUB_ENV"
          echo "STORAGE_DIR=$BIG_DISK/qemu-storage" >> "$GITHUB_ENV"
          echo "DOCKER_ROOT=$BIG_DISK/docker-data" >> "$GITHUB_ENV"
          echo "TUNNEL_DIR=$BIG_DISK/tunnel" >> "$GITHUB_ENV"
          sudo mkdir -p "$BIG_DISK/qemu-storage" "$BIG_DISK/docker-data" "$BIG_DISK/tunnel"
          sudo chmod 777 "$BIG_DISK/qemu-storage" "$BIG_DISK/docker-data" "$BIG_DISK/tunnel" || true
          sudo chown -R "$(id -u):$(id -g)" "$BIG_DISK/qemu-storage" "$BIG_DISK/docker-data" "$BIG_DISK/tunnel" 2>/dev/null || true

          ui_section "🐳 Docker data-root (hanya relokasi jika BIG_DISK mount terpisah)"
          if [ "$BIG_DISK" = "/mnt" ] && mountpoint -q /mnt 2>/dev/null; then
            ui_step "Relokasi docker ke $BIG_DISK/docker-data"
            sudo systemctl stop docker || sudo service docker stop || true
            sudo mkdir -p "$BIG_DISK/docker-data" /etc/docker
            if [ -d /var/lib/docker ] && [ "$(ls -A /var/lib/docker 2>/dev/null)" ]; then
              sudo rsync -a --delete /var/lib/docker/ "$BIG_DISK/docker-data/" || sudo cp -a /var/lib/docker/. "$BIG_DISK/docker-data/"
            fi
            echo "{\"data-root\": \"$BIG_DISK/docker-data\"}" | sudo tee /etc/docker/daemon.json
            sudo systemctl start docker || sudo service docker start || true
            sleep 5
          else
            ui_info "Skip relokasi docker (BIG_DISK=$BIG_DISK satu filesystem dengan /, 41G free sudah cukup)"
            sudo rm -f /etc/docker/daemon.json || true
            sudo systemctl restart docker || sudo service docker restart || true
            sleep 5
          fi
          docker info | grep -i "docker root" || true
          ui_group "docker system df + df -h"
          docker system df || true
          df -h
          ui_endgroup

          AVAIL_ROOT_KB=$(df --output=avail / | tail -n 1 | tr -d ' ')
          ui_kv "root avail" "$(awk -v k="$AVAIL_ROOT_KB" 'BEGIN { printf "%.1f GB", k/1048576 }')"
          ui_kv "bigdisk avail" "$(awk -v k="$BEST_AVAIL_KB" 'BEGIN { printf "%.1f GB", k/1048576 }')"
          if [ "$BEST_AVAIL_KB" -lt 15728640 ]; then
            ui_warn "Disk terbesar hanya $((BEST_AVAIL_KB/1024/1024))GB, QEMU Zorin berisiko No space left on device"
          fi

      - name: ⚡ Enable KVM (hardware acceleration)
        run: |
          source "$RUNNER_TEMP/ui.sh"
          ui_banner "ENABLE KVM" "Hardware acceleration untuk QEMU"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || ui_warn "NO /dev/kvm setelah udev reload"
          # Fallback permission jika udev trigger belum sempat buat node writable
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          ls -l /dev/kvm || true
          # Bukti CPU flags untuk diagnosis TCG vs KVM
          VMX=$(grep -Ec '(vmx|svm)' /proc/cpuinfo || true)
          if [ "$VMX" -gt 0 ]; then
            ui_ok "CPU mendukung virtualisasi hardware (vmx/svm count: $VMX) -> ${HOST_CPU_MODEL:-CPU host}"
          else
            ui_warn "0 flag vmx/svm (tanpa vmx/svm = TCG fallback)"
          fi

      - name: 🔍 Check KVM / TUN availability
        id: kvm
        run: |
          source "$RUNNER_TEMP/ui.sh"
          ui_banner "KVM / TUN CHECK"
          ui_kv "BIG_DISK" "$BIG_DISK"
          ui_kv "STORAGE_DIR" "$STORAGE_DIR"
          ui_kv "DOCKER_ROOT" "$DOCKER_ROOT"
          df -h "$BIG_DISK" / || true
          ui_section "/dev/kvm"
          if [ -c /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            ls -l /dev/kvm
            ui_ok "KVM writable, QEMU akan pakai hardware acceleration"
            echo "have_kvm=true" >> "$GITHUB_OUTPUT"
          elif [ -e /dev/kvm ]; then
            ls -l /dev/kvm
            ui_warn "/dev/kvm ada tapi tidak writable, QEMU fallback ke TCG (lambat)"
            echo "have_kvm=false" >> "$GITHUB_OUTPUT"
          else
            ui_warn "NO /dev/kvm, QEMU fallback ke emulasi software/tcg (lambat)"
            echo "have_kvm=false" >> "$GITHUB_OUTPUT"
          fi
          ui_section "/dev/net/tun"
          ls -l /dev/net/tun 2>&1 || ui_warn "NO /dev/net/tun"

      - name: 📦 Prepare storage (di disk terbesar)
        run: |
          source "$RUNNER_TEMP/ui.sh"
          ui_banner "PREPARE STORAGE"
          mkdir -p "$STORAGE_DIR" "$TUNNEL_DIR"
          df -h "$STORAGE_DIR" "$TUNNEL_DIR" /
          docker --version
          docker info | grep -i root || true
          ui_ok "Storage siap di $STORAGE_DIR"

      - name: 🚀 Run QEMU Zorin OS (detached, default qemux)
        run: |
          source "$RUNNER_TEMP/ui.sh"
          ui_banner "RUN QEMU ZORIN OS" "Container qemux/qemu (detached)"
          docker rm -f qemu 2>/dev/null || true

          KVM_ARGS=""
          if [ -c /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            KVM_ARGS="$KVM_ARGS --device=/dev/kvm"
            ui_ok "KVM enabled: /dev/kvm diteruskan ke container"
          else
            ui_warn "KVM tidak writable, container jalan tanpa /dev/kvm (TCG, lambat)"
          fi
          if [ -e /dev/net/tun ]; then
            KVM_ARGS="$KVM_ARGS --device=/dev/net/tun"
          fi

          ui_section "⚙️ Konfigurasi guest"
          ui_kv "BOOT" "${BOOT:-zorin}"
          ui_kv "CPU_CORES" "${CPU_CORES:-4}"
          ui_kv "RAM_SIZE" "${RAM_SIZE:-11G}"
          ui_kv "DISK_SIZE" "${DISK_SIZE:-40G}"
          ui_kv "KVM" "${KVM:-Y}"
          ui_kv "Storage" "$STORAGE_DIR"
          ui_kv "Host CPU" "${HOST_CPU_MODEL:-?}"

          # Perintah asli (diadaptasi -d agar workflow tidak hang):
          # docker run -it --rm --name qemu -e "BOOT=zorin" -p 8006:8006 --device=/dev/kvm --device=/dev/net/tun --cap-add NET_ADMIN -v "${PWD:-.}/qemu:/storage" --stop-timeout 120 docker.io/qemux/qemu
          ui_step "docker run qemux/qemu ..."
          docker run -d --rm \
            --name qemu \
            -e "BOOT=${BOOT:-zorin}" \
            -e "CPU_CORES=${CPU_CORES:-4}" \
            -e "RAM_SIZE=${RAM_SIZE:-11G}" \
            -e "DISK_SIZE=${DISK_SIZE:-40G}" \
            -e "KVM=${KVM:-Y}" \
            -p 8006:8006 \
            --cap-add NET_ADMIN \
            $KVM_ARGS \
            -v "${STORAGE_DIR}:/storage" \
            --stop-timeout 120 \
            docker.io/qemux/qemu

          sleep 10
          ui_section "🐳 Container"
          docker ps
          ui_group "df + 100 baris log awal container"
          df -h "$STORAGE_DIR" / "$BIG_DISK"
          docker logs --tail 100 qemu || true
          ui_endgroup
          ui_ok "Container qemu dijalankan"

      - name: ⏳ Wait for QEMU web UI :8006
        run: |
          source "$RUNNER_TEMP/ui.sh"
          ui_banner "WAIT QEMU WEB UI" "http://localhost:8006"
          MAX=30
          for i in $(seq 1 $MAX); do
            if curl -fsS -o /dev/null http://localhost:8006; then
              ui_ok "QEMU UI ready (attempt $i, ~$(( (i-1) * 5 ))s)"
              exit 0
            fi
            printf '  ⏳ attempt %2d/%d  ' "$i" "$MAX"; ui_bar $(( i * 100 / MAX )) 24
            sleep 5
          done
          ui_warn "QEMU UI tidak merespons, tampilkan logs"
          ui_group "docker logs --tail 200 qemu"
          docker logs --tail 200 qemu || true
          ui_endgroup
          exit 0

      - name: ☁️ Install cloudflared
        run: |
          source "$RUNNER_TEMP/ui.sh"
          ui_banner "INSTALL CLOUDFLARED"
          curl -fsSL -o "$TUNNEL_DIR/cloudflared.deb" https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          ui_group "dpkg -i cloudflared.deb"
          sudo dpkg -i "$TUNNEL_DIR/cloudflared.deb"
          ui_endgroup
          ui_ok "$(cloudflared --version)"
          df -h / "$BIG_DISK" | tail -n 10

      - name: 🌐 Start Cloudflare Quick Tunnel :8006
        id: tunnel
        run: |
          source "$RUNNER_TEMP/ui.sh"
          ui_banner "CLOUDFLARE QUICK TUNNEL" "Expose localhost:8006 ke internet"
          rm -f "$TUNNEL_DIR/tunnel.log" "$TUNNEL_DIR/tunnel.url" ./tunnel.log ./tunnel.url
          ln -sf "$TUNNEL_DIR/tunnel.log" ./tunnel.log || true
          ln -sf "$TUNNEL_DIR/tunnel.url" ./tunnel.url || true
          # Quick tunnel: URL acak https://xxx.trycloudflare.com, tanpa token
          nohup cloudflared tunnel --url http://localhost:8006 --no-autoupdate > "$TUNNEL_DIR/tunnel.log" 2>&1 &
          echo $! > /tmp/cloudflared.pid
          ui_kv "cloudflared pid" "$(cat /tmp/cloudflared.pid)"

          URL=""
          for i in $(seq 1 24); do
            sleep 5
            URL=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' "$TUNNEL_DIR/tunnel.log" | head -n 1 || true)
            printf '  ⏳ mencari URL tunnel, attempt %2d/24  ' "$i"; ui_bar $(( i * 100 / 24 )) 20
            if [ -n "$URL" ]; then
              echo "$URL" > "$TUNNEL_DIR/tunnel.url"
              echo "url=$URL" >> "$GITHUB_OUTPUT"
              break
            fi
          done

          ui_group "tunnel.log"
          cat "$TUNNEL_DIR/tunnel.log" || true
          ui_endgroup

          if [ -z "$URL" ]; then
            ui_err "Gagal mendapatkan Quick Tunnel URL"
            exit 1
          fi

          echo ""
          ui_banner "PUBLIC URL SIAP" "Buka link di bawah untuk akses Zorin OS"
          echo "  🌐 ${C_BOLD}${C_GREEN}${URL}${C_RESET}"
          echo ""

          {
            echo "## 🌐 QEMU Zorin Live"
            echo ""
            echo "- Public URL: **$URL**"
            echo "- QEMU UI lokal: \`http://localhost:8006\` (di runner)"
            echo "- Guest: BOOT=zorin, ${CPU_CORES} core, ${RAM_SIZE} RAM, ${DISK_SIZE} disk"
            echo "- Processor host: **${HOST_CPU_MODEL:-?}** (${HOST_CPU_THREADS:-?} thread)"
            echo "- Durasi target 6 jam"
            echo "- Storage: \`$STORAGE_DIR\` (disk: \`$BIG_DISK\`)"
            echo ""
            echo "Buka URL di atas untuk akses."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 💓 Keep alive 6 jam + heartbeat
        run: |
          source "$RUNNER_TEMP/ui.sh"
          URL=$(cat "$TUNNEL_DIR/tunnel.url")
          ui_banner "KEEP ALIVE + HEARTBEAT" "Interval 5 menit, target ~5j40m"
          echo "  🌐 ${C_BOLD}${C_GREEN}${URL}${C_RESET}"
          ui_kv "Storage" "$STORAGE_DIR di $BIG_DISK"
          ui_kv "Host CPU" "${HOST_CPU_MODEL:-?}"
          # 68 x 5 menit = 340 menit (~5h40m), sisakan buffer sebelum timeout 360 menit
          TOTAL_LOOPS=68
          for i in $(seq 1 $TOTAL_LOOPS); do
            ELAPSED=$(ui_elapsed)
            REMAIN=$(( TOTAL_LOOPS * 300 - (i - 1) * 300 ))
            HTTP=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:8006 || true)
            CSTATE=$(docker inspect -f '{{.State.Status}}' qemu 2>/dev/null || echo "gone")
            LOAD=$(awk '{print $1}' /proc/loadavg)
            CPU_PCT=$(awk -v l="$LOAD" -v n="$(nproc)" 'BEGIN { printf "%d", l / n * 100 }')
            read -r MT MU < <(free -m | awk '/^Mem:/ {print $2,$3}')
            MEM_PCT=$(( MU * 100 / MT ))

            echo ""
            ui_hr
            echo "${C_BOLD}💓 Heartbeat [$i/$TOTAL_LOOPS]${C_RESET}  $(date -u '+%H:%M:%S UTC')  ⏱ $(ui_fmt "$ELAPSED") berjalan, sisa ±$(ui_fmt "$REMAIN")"
            printf '  %-10s ' "Progress"; ui_bar $(( i * 100 / TOTAL_LOOPS )) 30
            if [ "$CSTATE" = "running" ]; then ui_ok "Container qemu: $CSTATE"; else ui_err "Container qemu: $CSTATE"; fi
            if [ "$HTTP" = "200" ]; then ui_ok "Web UI :8006 -> HTTP $HTTP"; else ui_warn "Web UI :8006 -> HTTP $HTTP"; fi
            ui_bar_line "CPU load" "$CPU_PCT"
            ui_bar_line "RAM" "$MEM_PCT"
            ui_bar_line "Disk /" "$(ui_pct /)"
            ui_bar_line "Disk big" "$(ui_pct "$BIG_DISK")"

            ui_group "Detail heartbeat $i/$TOTAL_LOOPS (docker stats, tunnel log, df)"
            docker ps --filter name=qemu || true
            docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}' qemu 2>/dev/null || true
            echo "--- tunnel.log (5 baris terakhir) ---"
            tail -n 5 "$TUNNEL_DIR/tunnel.log" || true
            echo "--- df ---"
            df -h / "$BIG_DISK" | tail -n 8
            docker system df 2>/dev/null | tail -n 10 || true
            ui_endgroup

            # Guard: stop elegan jika big disk <3GB agar tidak corrupt runner diag log
            BIG_AVAIL_KB=$(df --output=avail "$BIG_DISK" | tail -n 1 | tr -d ' ')
            if [ "$BIG_AVAIL_KB" -lt 3145728 ]; then
              ui_err "Disk $BIG_DISK tersisa <3GB, stop elegan untuk hindari No space left on device"
              docker logs --tail 200 qemu || true
              exit 1
            fi
            sleep 300
          done

      - name: 🧯 Cleanup (always)
        if: always()
        run: |
          if [ ! -f "$RUNNER_TEMP/ui.sh" ]; then
            echo "UI helper belum diinisialisasi, skip cleanup"
            exit 0
          fi
          source "$RUNNER_TEMP/ui.sh"
          ui_banner "CLEANUP" "Hentikan container & tunnel"
          ui_group "tunnel.log"
          cat "$TUNNEL_DIR/tunnel.log" 2>/dev/null || cat ./tunnel.log || true
          ui_endgroup
          ui_group "docker logs --tail 200 qemu"
          docker logs --tail 200 qemu || true
          ui_endgroup
          ui_step "Menghentikan container qemu..."
          docker stop -t 120 qemu || true
          ui_step "Menghentikan cloudflared..."
          kill "$(cat /tmp/cloudflared.pid)" 2>/dev/null || true
          df -h || true
          echo ""
          ui_banner "SELESAI" "Total durasi job: $(ui_fmt "$(ui_elapsed)")"
